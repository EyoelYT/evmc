name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the floor declared in Package-Requires; snapshot is advisory,
        # so a broken upstream Emacs shouldn't redden.
        emacs_version: ['29.1', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - uses: emacs-eldev/setup-eldev@v1

      # -p builds and tests the packaged form, which is what users install;
      # -dtT prints a backtrace instead of just a failure line.
      - name: Compile
        run: eldev -p -dtT compile

      - name: Lint
        run: eldev -p -dtT lint

      - name: Test
        run: eldev -p -dtT test
